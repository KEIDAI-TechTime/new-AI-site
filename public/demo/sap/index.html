
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未来住建株式会社 - 生産調達システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #F7F7F7;
    }
    .sap-blue { background-color: #0A6ED1; }
    .sap-text-blue { color: #0A6ED1; }
    .sap-border-blue { border-color: #0A6ED1; }
    .alv-grid th { background-color: #F2F2F2; font-weight: 600; text-align: left; }
    .alv-grid tr:hover { background-color: #EBF5FE; cursor: pointer; }
    .fiori-input:focus { outline: none; border-color: #0A6ED1; ring: 2px; ring-color: #0A6ED1; }
    /* SAP Fiori specific scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #aaa; }
    /* Mobile responsive overrides */
    @media (max-width: 767px) {
      body { overflow: auto !important; }
      body > #root > div { height: auto !important; min-height: 100vh; }
      body > #root > div > div { overflow: visible !important; flex-wrap: wrap; }
      nav[class*="border-r"] { display: none !important; }
      table { font-size: 12px; }
      header { flex-wrap: wrap; gap: 4px; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      nav[class*="border-r"] { width: 48px !important; }
      nav[class*="border-r"] span { display: none; }
    }
  </style>
  <script type="module" crossorigin src="/demo/sap/assets/index-muXah816.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
