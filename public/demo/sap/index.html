
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未来住建株式会社 - 生産調達システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #F7F7F7;
    }
    .sap-blue { background-color: #0A6ED1; }
    .sap-text-blue { color: #0A6ED1; }
    .sap-border-blue { border-color: #0A6ED1; }
    .alv-grid th { background-color: #F2F2F2; font-weight: 600; text-align: left; }
    .alv-grid tr:hover { background-color: #EBF5FE; cursor: pointer; }
    .fiori-input:focus { outline: none; border-color: #0A6ED1; ring: 2px; ring-color: #0A6ED1; }
    /* SAP Fiori specific scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #aaa; }

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      /* Remove overflow hidden on mobile */
      body { overflow-y: auto !important; overflow-x: hidden !important; }

      /* CRITICAL: Hide sidebar/navigation on mobile */
      #root > div > aside,
      #root > div > nav:first-child,
      #root > div > div:first-child:has(nav),
      aside[class*="sidebar"],
      aside[class*="w-64"],
      aside[class*="w-56"],
      nav[class*="sidebar"],
      div[class*="sidebar"] {
        display: none !important;
        width: 0 !important;
        min-width: 0 !important;
      }

      /* Force main content to full width */
      #root > div,
      #root > div > div,
      #root > div > main,
      main[class*="flex-1"],
      div[class*="flex-1"],
      .main-content,
      .sapMPage {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding: 12px !important;
        flex: 1 1 100% !important;
      }

      /* Override flex container */
      #root > div > div[class*="flex"] {
        display: block !important;
      }

      /* Header adjustments */
      header,
      .shell-bar,
      .sapMShellBar,
      div[class*="h-16"],
      div[class*="h-14"] {
        padding: 0 12px !important;
        height: 56px !important;
        min-height: 56px !important;
      }

      /* Hide less important header items on mobile */
      header > div > div:not(:first-child):not(:last-child),
      .shell-bar-secondary,
      .sapMBarRight .sapMBtn:not(:first-child) {
        display: none !important;
      }

      /* Stack navigation vertically */
      .sapMITH,
      .sapMITBHead,
      nav[class*="flex"] {
        flex-wrap: wrap !important;
      }

      /* Make tables scrollable */
      table,
      .alv-grid,
      .sapMList,
      .sapUiTable,
      div[class*="overflow-auto"]:has(table) {
        overflow-x: auto !important;
        display: block !important;
        width: 100% !important;
      }

      /* Reduce table font size */
      table td,
      table th,
      .alv-grid td,
      .alv-grid th {
        font-size: 11px !important;
        padding: 6px 4px !important;
        white-space: nowrap !important;
      }

      /* Hide non-essential columns */
      table td:nth-child(n+5),
      table th:nth-child(n+5),
      .alv-grid td:nth-child(n+5),
      .alv-grid th:nth-child(n+5) {
        display: none !important;
      }

      /* Stack form fields vertically */
      .sapUiForm .sapUiFormResGrid,
      .sapMFlexBox,
      div[class*="grid"],
      div[class*="flex"][class*="gap"] {
        flex-direction: column !important;
        grid-template-columns: 1fr !important;
      }

      /* Full width form fields */
      input,
      select,
      textarea,
      .sapMInput,
      .sapMSelect,
      .sapMComboBox {
        width: 100% !important;
        max-width: 100% !important;
      }

      /* Adjust button sizes */
      button,
      .sapMBtn {
        min-width: auto !important;
        padding: 8px 12px !important;
        font-size: 13px !important;
      }

      /* Stack buttons vertically in toolbars */
      .sapMTB .sapMBarChild,
      div[class*="flex"][class*="gap"] > button {
        margin: 4px 0 !important;
      }

      /* Reduce padding on cards */
      .sapFCard,
      .sapMPanel,
      div[class*="bg-white"][class*="rounded"],
      div[class*="shadow"] {
        margin: 8px 4px !important;
        padding: 12px !important;
      }

      /* Reduce font sizes */
      h1, .sapMTitle { font-size: 18px !important; }
      h2 { font-size: 16px !important; }
      h3 { font-size: 14px !important; }

      /* Make dialog full screen */
      .sapMDialog,
      div[role="dialog"],
      div[class*="modal"] {
        width: 95vw !important;
        max-width: 95vw !important;
        margin: 8px auto !important;
      }

      /* Container adjustments */
      .container,
      div[class*="container"],
      div[class*="max-w-"] {
        max-width: 100% !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
      }
    }

    @media (max-width: 640px) {
      /* Extra small screens */
      header,
      .shell-bar,
      .sapMShellBar,
      div[class*="h-16"],
      div[class*="h-14"] {
        height: 48px !important;
        min-height: 48px !important;
        padding: 0 8px !important;
      }

      /* Smaller text */
      table td,
      table th,
      .alv-grid td,
      .alv-grid th {
        font-size: 10px !important;
        padding: 4px 2px !important;
      }

      /* Hide even more columns */
      table td:nth-child(n+4),
      table th:nth-child(n+4),
      .alv-grid td:nth-child(n+4),
      .alv-grid th:nth-child(n+4) {
        display: none !important;
      }

      /* Reduce all padding */
      .sapFCard,
      .sapMPanel,
      .main-content,
      div[class*="bg-white"],
      #root > div > main,
      #root > div > div {
        padding: 8px !important;
        margin: 4px 2px !important;
      }

      h1, .sapMTitle { font-size: 16px !important; }
      h2 { font-size: 14px !important; }
      h3 { font-size: 12px !important; }
    }

    /* Tablet specific (768px - 1024px) */
    @media (min-width: 769px) and (max-width: 1024px) {
      table td,
      table th,
      .alv-grid td,
      .alv-grid th {
        font-size: 12px !important;
        padding: 8px 6px !important;
      }

      /* Show first 6 columns only */
      table td:nth-child(n+7),
      table th:nth-child(n+7),
      .alv-grid td:nth-child(n+7),
      .alv-grid th:nth-child(n+7) {
        display: none !important;
      }

      .main-content,
      #root > div > main,
      #root > div > div {
        padding: 16px !important;
      }

      /* Reduce sidebar width */
      aside,
      nav:first-child {
        width: 200px !important;
        min-width: 200px !important;
      }
    }
  </style>
  <script type="module" crossorigin src="/demo/sap/assets/index-muXah816.js"></script>
</head>
<body class="overflow-hidden">
  <div id="root"></div>
</body>
</html>
