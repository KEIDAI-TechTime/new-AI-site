<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧問先カルテ - 税理士事務所向け管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8f6f1;
            color: #0a1628;
            letter-spacing: 0.02em;
        }
        h1, h2, h3, h4, .font-serif {
            font-family: 'Noto Serif JP', serif;
        }
        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Mobile responsive overrides */
        @media (max-width: 767px) {
            body { overflow: auto !important; }
            body > #root > div { height: auto !important; min-height: 100vh; }
            body > #root > div > div { overflow: visible !important; flex-wrap: wrap; }
            nav[class*="border-r"] { display: none !important; }
            table { font-size: 12px; }
            header { flex-wrap: wrap; gap: 4px; }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            nav[class*="border-r"] { width: 48px !important; }
            nav[class*="border-r"] span { display: none; }
        }
    </style>
