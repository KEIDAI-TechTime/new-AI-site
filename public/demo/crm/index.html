
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce-like CRM Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto+Sans+JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #F3F3F3;
            color: #181818;
        }
        .sfdc-blue { color: #0070D2; }
        .bg-sfdc-blue { background-color: #0070D2; }
        .border-sfdc-blue { border-color: #0070D2; }
        .sfdc-shadow { box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.1); }
        .sfdc-card { background: white; border-radius: 0.25rem; border: 1px solid #DDDBDA; }
        .sfdc-header { background-color: #F3F3F3; }

        /* Custom scrollbar for Kanban */
        .kanban-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .kanban-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .kanban-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .kanban-scroll::-webkit-scrollbar-thumb:hover { background: #aaa; }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            /* Header adjustments */
            .slds-global-header, header {
                padding: 0 12px !important;
                height: 56px !important;
            }

            /* Hide non-essential header items */
            .slds-global-actions__item:not(:first-child:not(:last-child)) {
                display: none !important;
            }

            /* Stack navigation tabs */
            .slds-tabs_default__nav, .nav-tabs {
                flex-wrap: wrap !important;
            }

            .slds-tabs_default__item {
                flex: 1 1 auto !important;
                min-width: 80px !important;
            }

            /* Make kanban scrollable */
            .kanban-scroll {
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch !important;
            }

            .kanban-column {
                min-width: 280px !important;
                margin: 0 8px !important;
            }

            /* Stack cards vertically on mobile */
            .slds-grid, .grid {
                display: flex !important;
                flex-direction: column !important;
            }

            .slds-col, .col {
                width: 100% !important;
                max-width: 100% !important;
                margin-bottom: 12px !important;
            }

            /* Full width cards */
            .sfdc-card {
                margin: 8px 4px !important;
                padding: 12px !important;
            }

            /* Reduce table complexity */
            .slds-table td, .slds-table th {
                font-size: 12px !important;
                padding: 8px 4px !important;
            }

            /* Hide non-essential table columns */
            .slds-table td:nth-child(n+5),
            .slds-table th:nth-child(n+5) {
                display: none !important;
            }

            /* Stack form fields */
            .slds-form-element {
                margin-bottom: 12px !important;
            }

            .slds-form__row {
                flex-direction: column !important;
            }

            /* Full width inputs */
            .slds-input, .slds-select, .slds-textarea {
                width: 100% !important;
            }

            /* Adjust button sizes */
            .slds-button {
                padding: 8px 12px !important;
                font-size: 13px !important;
            }

            /* Hide sidebar on mobile */
            .sidebar, .slds-panel {
                display: none !important;
            }

            /* Full width main content */
            .main-content, .content-area {
                width: 100% !important;
                padding: 12px !important;
            }

            /* Reduce heading sizes */
            h1 { font-size: 20px !important; }
            h2 { font-size: 18px !important; }
            h3 { font-size: 16px !important; }

            /* Modal full screen */
            .slds-modal__container {
                width: 95% !important;
                max-width: 95% !important;
                margin: 8px !important;
            }

            /* Compact page header */
            .slds-page-header {
                padding: 12px !important;
            }

            .slds-page-header__title {
                font-size: 18px !important;
            }
        }

        @media (max-width: 640px) {
            /* Extra small screens */
            .slds-global-header, header {
                height: 48px !important;
                padding: 0 8px !important;
            }

            .kanban-column {
                min-width: 240px !important;
            }

            .slds-table td, .slds-table th {
                font-size: 11px !important;
                padding: 6px 2px !important;
            }

            /* Hide even more columns */
            .slds-table td:nth-child(n+4),
            .slds-table th:nth-child(n+4) {
                display: none !important;
            }

            /* Compact everything */
            .sfdc-card {
                padding: 8px !important;
                margin: 4px 2px !important;
            }

            h1 { font-size: 18px !important; }
            h2 { font-size: 16px !important; }
        }

        /* Tablet (768px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .slds-table td:nth-child(n+7),
            .slds-table th:nth-child(n+7) {
                display: none !important;
            }

            .kanban-column {
                min-width: 300px !important;
            }
        }
    </style>
  <script type="module" crossorigin src="/demo/crm/assets/index-BMYDww8K.js"></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
